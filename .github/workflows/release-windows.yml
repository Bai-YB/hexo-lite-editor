name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix"
        required: true
        default: "1.0.5"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Resolve version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = "${{ inputs.version }}"
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend checks
        run: |
          pnpm check
          pnpm test
          pnpm test:e2e
          pnpm build
          pnpm audit --prod

      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test

      - name: Package Windows release
        shell: pwsh
        run: ./scripts/package-release.ps1 -Version $env:RELEASE_VERSION

      - name: Smoke test portable archive
        shell: pwsh
        run: ./scripts/smoke-portable.ps1 -ArchivePath "release-artifacts/$env:RELEASE_VERSION/Hexo-Lite-Editor_$($env:RELEASE_VERSION)_windows-x64-portable.zip"

      - name: Smoke test installers
        shell: pwsh
        run: ./scripts/smoke-installers.ps1 -NsisPath "release-artifacts/$env:RELEASE_VERSION/Hexo-Lite-Editor_$($env:RELEASE_VERSION)_windows-x64-setup.exe" -MsiPath "release-artifacts/$env:RELEASE_VERSION/Hexo-Lite-Editor_$($env:RELEASE_VERSION)_windows-x64.msi"

      - uses: actions/upload-artifact@v7
        with:
          name: Hexo-Lite-Editor-${{ env.RELEASE_VERSION }}-windows-x64
          path: |
            release-artifacts/${{ env.RELEASE_VERSION }}/Hexo-Lite-Editor_${{ env.RELEASE_VERSION }}_windows-x64-portable.zip
            release-artifacts/${{ env.RELEASE_VERSION }}/Hexo-Lite-Editor_${{ env.RELEASE_VERSION }}_windows-x64-setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = ".github/release-notes/v$env:RELEASE_VERSION.md"
          if (-not (Test-Path -LiteralPath $notes)) {
            throw "Missing release notes: $notes"
          }
          $releaseDirectory = "release-artifacts/$env:RELEASE_VERSION"
          $assets = @(
            "$releaseDirectory/Hexo-Lite-Editor_$($env:RELEASE_VERSION)_windows-x64-portable.zip"
            "$releaseDirectory/Hexo-Lite-Editor_$($env:RELEASE_VERSION)_windows-x64-setup.exe"
          )
          if (gh release view $env:GITHUB_REF_NAME 2>$null) {
            gh release upload $env:GITHUB_REF_NAME @assets --clobber
            gh release edit $env:GITHUB_REF_NAME --title "Hexo Lite Editor $env:RELEASE_VERSION" --notes-file $notes --latest
          } else {
            gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "Hexo Lite Editor $env:RELEASE_VERSION" --notes-file $notes --latest
          }

name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix"
        required: true
        default: "1.0.6"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Resolve version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
            if ($env:GITHUB_REF_NAME -notmatch ('^v' + [regex]::Escape($version) + '(?:-r[1-9][0-9]*)?$')) { throw "Release tag does not match package version" }
          } else {
            $version = "${{ inputs.version }}"
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend checks
        run: |
          pnpm check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:e2e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm audit --prod
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          try {
            ./scripts/package-release.ps1 -Version $env:RELEASE_VERSION *>&1 | Tee-Object -FilePath windows-package.log
            if ($LASTEXITCODE -ne 0) { throw "Windows package command exited with code $LASTEXITCODE" }
          } catch {
            $_ | Out-String | Tee-Object -FilePath windows-package.log -Append | Write-Error
            exit 1
          }

      - name: Upload package diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-package-diagnostics
          path: windows-package.log
          if-no-files-found: ignore

      - name: Smoke test portable archive
        shell: pwsh
        run: ./scripts/smoke-portable.ps1 -ArchivePath "release-artifacts/$env:RELEASE_VERSION/Hexo-Lite-Editor_$($env:RELEASE_VERSION)_windows-x64-portable.zip"

      - name: Smoke test installers
        shell: pwsh
        run: ./scripts/smoke-installers.ps1 -NsisPath "release-artifacts/$env:RELEASE_VERSION/Hexo-Lite-Editor_$($env:RELEASE_VERSION)_windows-x64-setup.exe" -MsiPath "release-artifacts/$env:RELEASE_VERSION/Hexo-Lite-Editor_$($env:RELEASE_VERSION)_windows-x64.msi"

      - uses: actions/upload-artifact@v7
        with:
          name: Hexo-Lite-Editor-${{ env.RELEASE_VERSION }}-windows-x64
          path: |
            release-artifacts/${{ env.RELEASE_VERSION }}/Hexo-Lite-Editor_${{ env.RELEASE_VERSION }}_windows-x64-portable.zip
            release-artifacts/${{ env.RELEASE_VERSION }}/Hexo-Lite-Editor_${{ env.RELEASE_VERSION }}_windows-x64-setup.exe
            release-artifacts/${{ env.RELEASE_VERSION }}/Hexo-Lite-Editor_${{ env.RELEASE_VERSION }}_windows-x64.msi
            release-artifacts/${{ env.RELEASE_VERSION }}/*.sig
            release-artifacts/${{ env.RELEASE_VERSION }}/release-manifest.json
            release-artifacts/${{ env.RELEASE_VERSION }}/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF_NAME } else { "v$env:RELEASE_VERSION" }
          $notes = ".github/release-notes/v$env:RELEASE_VERSION.md"
          if (-not (Test-Path -LiteralPath $notes)) {
            throw "Missing release notes: $notes"
          }
          $releaseDirectory = "release-artifacts/$env:RELEASE_VERSION"
          $assets = @(
            "$releaseDirectory/Hexo-Lite-Editor_$($env:RELEASE_VERSION)_windows-x64-portable.zip"
            "$releaseDirectory/Hexo-Lite-Editor_$($env:RELEASE_VERSION)_windows-x64-setup.exe"
            "$releaseDirectory/Hexo-Lite-Editor_$($env:RELEASE_VERSION)_windows-x64-setup.exe.sig"
            "$releaseDirectory/Hexo-Lite-Editor_$($env:RELEASE_VERSION)_windows-x64.msi"
            "$releaseDirectory/Hexo-Lite-Editor_$($env:RELEASE_VERSION)_windows-x64.msi.sig"
            "$releaseDirectory/release-manifest.json"
            "$releaseDirectory/SHA256SUMS.txt"
          )
          if (gh release view $tag 2>$null) {
            gh release edit $tag --draft --title "Hexo Lite Editor $env:RELEASE_VERSION" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $tagArgument = if ($env:GITHUB_REF -like "refs/tags/v*") { @("--verify-tag") } else { @("--target", $env:GITHUB_SHA) }
            gh release create $tag @assets @tagArgument --draft --title "Hexo Lite Editor $env:RELEASE_VERSION" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

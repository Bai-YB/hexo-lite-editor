name: Build macOS

on:
  push:
    branches:
      - "codex/macos-build"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix"
        required: true
        default: "1.0.4"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend checks
        run: |
          pnpm check
          pnpm test
          pnpm build

      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo fmt --check 2>&1 | tee rust-checks.log
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee -a rust-checks.log
          cargo test 2>&1 | tee -a rust-checks.log

      - name: Upload Rust diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-rust-diagnostics
          path: src-tauri/rust-checks.log
          if-no-files-found: ignore

      - name: Build universal macOS app and DMG
        run: |
          set -o pipefail
          set +e
          pnpm release:macos -- "${{ inputs.version || '1.0.4' }}" 2>&1 | tee macos-package.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 ]]; then
            details="$(tail -n 12 macos-package.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=macOS packaging failed::$details"
            exit "$status"
          fi

      - name: Upload package diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-package-diagnostics
          path: macos-package.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: Hexo-Lite-Editor-${{ inputs.version || '1.0.4' }}-macos-universal
          path: release-artifacts/${{ inputs.version || '1.0.4' }}/*macos*
          if-no-files-found: error

name: Build macOS

on:
  push:
    branches:
      - "codex/macos-build"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix"
        required: true
        default: "1.0.6"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
            tag="$GITHUB_REF_NAME"
            TAG="$tag" VERSION="$version" node -e 'if (!new RegExp("^v" + process.env.VERSION.replaceAll(".", "\\.") + "(?:-r[1-9][0-9]*)?$").test(process.env.TAG)) throw new Error("Tag does not match package version")'
          else
            version="${{ inputs.version || '1.0.6' }}"
            tag="v$version"
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Frontend checks
        run: |
          pnpm check
          pnpm test
          pnpm build

      - name: Rust checks
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo fmt --check 2>&1 | tee rust-checks.log
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee -a rust-checks.log
          cargo test 2>&1 | tee -a rust-checks.log

      - name: Upload Rust diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-rust-diagnostics
          path: src-tauri/rust-checks.log
          if-no-files-found: ignore

      - name: Build universal macOS app and DMG
        run: |
          set -o pipefail
          set +e
          pnpm release:macos -- "$RELEASE_VERSION" 2>&1 | tee macos-package.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 ]]; then
            perl -pe 's/\e\[[0-9;]*[A-Za-z]//g' macos-package.log \
              | grep -Ei 'error(:|\[)|failed|not found|no such file|missing|refusing' \
              | tail -n 20 \
              | while IFS= read -r line; do
                  line="${line//'%'/'%25'}"
                  echo "::error title=macOS packaging failed::$line"
                done
            exit "$status"
          fi

      - name: Upload package diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-package-diagnostics
          path: macos-package.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: Hexo-Lite-Editor-${{ env.RELEASE_VERSION }}-macos-universal
          path: release-artifacts/${{ env.RELEASE_VERSION }}/*
          if-no-files-found: error

      - name: Publish macOS assets to existing release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$RELEASE_VERSION"
          tag="$RELEASE_TAG"
          notes=".github/release-notes/v$version.md"
          gh release view "$tag" >/dev/null || gh release create "$tag" --draft --title "Hexo Lite Editor $version" --notes-file "$notes"
          gh release upload "$tag" \
            "release-artifacts/$version/Hexo-Lite-Editor_${version}_macos-universal.dmg" \
            "release-artifacts/$version/Hexo-Lite-Editor_${version}_macos-universal.app.zip" \
            "release-artifacts/$version/Hexo-Lite-Editor_${version}_macos-universal.app.tar.gz" \
            "release-artifacts/$version/Hexo-Lite-Editor_${version}_macos-universal.app.tar.gz.sig" \
            "release-artifacts/$version/release-manifest-macos.json" \
            "release-artifacts/$version/SHA256SUMS-macos.txt" \
            --clobber

          mkdir -p "release-artifacts/$version/windows-updater"
          windows_installer_name="Hexo-Lite-Editor_${version}_windows-x64-setup.exe"
          for attempt in {1..30}; do
            rm -f "release-artifacts/$version/windows-updater/"*
            gh release download "$tag" --pattern "$windows_installer_name" --pattern "$windows_installer_name.sig" --dir "release-artifacts/$version/windows-updater" --clobber 2>/dev/null || true
            windows_asset="release-artifacts/$version/windows-updater/$windows_installer_name"
            if [[ -n "$windows_asset" && -f "$windows_asset.sig" ]]; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              echo "::error title=Windows updater missing::Timed out waiting for the Windows signed updater assets."
              exit 1
            fi
            sleep 20
          done
          windows_signature="$windows_asset.sig"
          node scripts/generate-latest-json.mjs \
            --version "$version" \
            --tag "$tag" \
            --repository "$GITHUB_REPOSITORY" \
            --notes "$notes" \
            --windows-asset "$windows_asset" \
            --windows-signature "$windows_signature" \
            --macos-asset "release-artifacts/$version/Hexo-Lite-Editor_${version}_macos-universal.app.tar.gz" \
            --macos-signature "release-artifacts/$version/Hexo-Lite-Editor_${version}_macos-universal.app.tar.gz.sig" \
            --output "release-artifacts/$version/latest.json"
          node scripts/verify-updater-manifest.mjs \
            --manifest "release-artifacts/$version/latest.json" \
            --version "$version" \
            --tag "$tag" \
            --platform windows-x86_64 \
            --platform darwin-x86_64 \
            --platform darwin-aarch64
          (
            cd "release-artifacts/$version"
            shasum -a 256 latest.json >> SHA256SUMS-macos.txt
          )
          gh release upload "$tag" \
            "release-artifacts/$version/latest.json" \
            "release-artifacts/$version/SHA256SUMS-macos.txt" \
            --clobber
          mkdir -p "release-artifacts/$version/updater-verify"
          gh release download "$tag" --pattern latest.json --dir "release-artifacts/$version/updater-verify" --clobber
          node scripts/verify-updater-manifest.mjs \
            --manifest "release-artifacts/$version/updater-verify/latest.json" \
            --version "$version" \
            --tag "$tag" \
            --platform windows-x86_64 \
            --platform darwin-x86_64 \
            --platform darwin-aarch64
          gh release edit "$tag" --draft=false --latest

name: Build macOS

on:
  push:
    branches:
      - "codex/macos-build"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix"
        required: true
        default: "1.0.6.5.3"

permissions:
  contents: write

concurrency:
  group: release-macos-${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        run: |
          version="$(node scripts/release-version.mjs version)"
          runtime_version="$(node scripts/release-version.mjs runtimeVersion)"
          tag="$(node scripts/release-version.mjs tag)"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Release tag does not match package version" >&2; exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "${{ inputs.version }}" != "$version" ]]; then
            echo "Requested release does not match package version" >&2; exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RUNTIME_VERSION=$runtime_version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Frontend checks
        run: |
          pnpm check
          pnpm test
          pnpm build

      - name: Rust checks
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo fmt --check 2>&1 | tee rust-checks.log
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee -a rust-checks.log
          cargo test --all-targets --all-features 2>&1 | tee -a rust-checks.log

      - name: WebKit interaction parity
        run: |
          pnpm exec playwright install chromium webkit
          pnpm test:e2e --project desktop-webkit

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-playwright-report
          path: output/playwright/
          if-no-files-found: ignore

      - name: Upload Rust diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-rust-diagnostics
          path: src-tauri/rust-checks.log
          if-no-files-found: ignore

      - name: Build universal macOS app and DMG
        run: |
          set -o pipefail
          set +e
          pnpm release:macos -- "$RELEASE_VERSION" 2>&1 | tee macos-package.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 ]]; then
            perl -pe 's/\e\[[0-9;]*[A-Za-z]//g' macos-package.log \
              | grep -Ei 'error(:|\[)|failed|not found|no such file|missing|refusing' \
              | tail -n 20 \
              | while IFS= read -r line; do
                  line="${line//'%'/'%25'}"
                  echo "::error title=macOS packaging failed::$line"
                done
            exit "$status"
          fi

      - name: Upload package diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-package-diagnostics
          path: macos-package.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: Hexo-Lite-Editor-${{ env.RELEASE_VERSION }}-macos-universal
          path: release-artifacts/${{ env.RELEASE_VERSION }}/*
          if-no-files-found: error

      - name: Publish macOS assets to existing release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$RELEASE_VERSION"
          tag="$RELEASE_TAG"
          notes=".github/release-notes/v$version.md"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$(git rev-parse HEAD)" --title "Hexo Lite Editor $version" --notes-file "$notes" \
              || gh release view "$tag" >/dev/null
          fi
          if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != true ]]; then
            echo "Release $tag is already published; refusing to replace immutable assets."
            exit 0
          fi
          gh release upload "$tag" \
            "release-artifacts/$version/Hexo-Lite-Editor_${version}_macos-universal.dmg" \
            "release-artifacts/$version/Hexo-Lite-Editor_${version}_macos-universal.app.zip" \
            "release-artifacts/$version/Hexo-Lite-Editor_${version}_macos-universal.app.tar.gz" \
            "release-artifacts/$version/Hexo-Lite-Editor_${version}_macos-universal.app.tar.gz.sig" \
            "release-artifacts/$version/release-manifest-macos.json" \
            "release-artifacts/$version/SHA256SUMS-macos.txt" \
            --clobber

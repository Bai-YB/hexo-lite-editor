[package]
name = "hexo-lite-editor"
version = "1.0.5"
description = "A quiet, native desktop workspace for Hexo publishing"
authors = ["Bai-YB"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hexo_lite_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
walkdir = "2"
wait-timeout = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls", "cookies"] }
regex = "1"
atomic-write-file = "0.3"
keyring = { version = "4", features = ["v1"] }
mime_guess = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
futures-util = "0.3"
open = "5"
percent-encoding = "2"
process-wrap = { version = "9", features = ["tokio1"] }
semver = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["process", "rt-multi-thread", "sync", "time", "io-util", "net"] }
trash = "5"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }

[target.'cfg(windows)'.dependencies]
rfd = "0.16"
winreg = "0.55"
